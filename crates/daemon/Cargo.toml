[package]
name = "tack_daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
control-conformance = []

[[bin]]
name = "tack-daemon"
path = "src/main.rs"

[[test]]
name = "control_conformance"
path = "tests/control_conformance.rs"
required-features = ["control-conformance"]

[dependencies]
rustix = { version = "1", default-features = false, features = ["process"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tack_protocol = { path = "../protocol" }
barn-stall = { git = "https://github.com/wrkhse/barn.git", rev = "52b736505ec82b1e058f1ab27bd7c280b6b8724b" }

[lints]
workspace = true
