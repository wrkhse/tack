[package]
name = "tack-adapter-codex"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "tack_adapter_codex"

[dependencies]
serde_json.workspace = true
# Codex trusts a hook by the SHA-256 of its normalized identity; tack writes
# the same hash, so it needs the same digest. No workspace crate provides one.
sha2 = { version = "0.10", default-features = false }
tack_protocol = { path = "../../crates/protocol" }

[lints]
workspace = true
