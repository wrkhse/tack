name: OpenCode review

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request to review in a proof run
        required: false
        default: ""
        type: string
      primary_model:
        description: Proof-only primary model (current primary, opencode/hy4-flash-free, opencode-go/hy4-flash-free or test/unreachable)
        required: false
        default: ""
        type: string

concurrency:
  group: opencode-review-${{ github.event_name == 'pull_request' && github.event.pull_request.number || format('{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: true

jobs:
  gather-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Test review gathering on fixtures
        shell: bash
        run: bash .github/scripts/test-gather-review-input.sh
      - name: Test review posting on fixtures
        shell: bash
        run: bash .github/scripts/test-review-post.sh
      - name: Test carry-forward verdict lookup on fixtures
        shell: bash
        run: bash .github/scripts/test-carry-forward.sh
      - name: Test verdict enforcement on fixtures
        shell: bash
        run: bash .github/scripts/test-enforce-verdict.sh
