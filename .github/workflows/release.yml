name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0
          target: ${{ matrix.target }}
      - name: Build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          cargo build --release --locked \
            --target "$TARGET" \
            -p tack-cli -p tack_daemon
      - name: Verify version matches tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          version=$(cargo metadata --locked --no-deps --format-version 1 | \
            python3 -c 'import json, sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "tack-cli"))')

          expected="${TAG#v}"
          if [[ "$version" != "$expected" ]]; then
            echo "tack-cli version $version does not match tag $TAG (expected $expected)" >&2
            exit 1
          fi
      - name: Package
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          out="dist/$TARGET"
          mkdir -p "$out"

          tar -czf "$out/tack-$TAG-$TARGET.tar.gz" \
            -C "target/$TARGET/release" \
            tack tack-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tack-${{ github.ref_name }}-${{ matrix.target }}
          path: dist/${{ matrix.target }}/*

  publish:
    if: startsWith(github.ref_name, 'v') && contains(github.ref_name, '-rc.')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: tack-${{ github.ref_name }}-*
          path: dist
          merge-multiple: true
      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          mapfile -t tarballs < <(find dist -type f -name '*.tar.gz' | sort)

          if [[ "${#tarballs[@]}" -ne 3 ]]; then
            echo "expected 3 release tarballs, found ${#tarballs[@]}" >&2
            exit 1
          fi

          (cd dist && sha256sum -- *.tar.gz > SHA256SUMS)

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --verify-tag \
            --title "tack $TAG" \
            --notes "Rust-built tack CLI and daemon for the three targets; checksums attached; release candidate for slice 1." \
            "${tarballs[@]}" dist/SHA256SUMS

  skip:
    if: startsWith(github.ref_name, 'v') && !contains(github.ref_name, '-rc.')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Explain skip
        env:
          TAG: ${{ github.ref_name }}
        run: echo "Tag $TAG is not a release candidate (expected v*-rc.*); skipping publish."
