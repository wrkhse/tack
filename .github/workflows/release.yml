name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100
          target: ${{ matrix.target }}
      - name: Build
        run: |
          cargo build --release --locked \
            --target ${{ matrix.target }} \
            -p tack-cli -p tack_daemon
      - name: Package
        shell: bash
        run: |
          set -euo pipefail

          out="dist/${{ matrix.target }}"
          mkdir -p "$out"
          cp "target/${{ matrix.target }}/release/tack" \
            "target/${{ matrix.target }}/release/tack-daemon" "$out"

          cd "$out"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum tack tack-daemon > SHA256SUMS
          else
            shasum -a 256 tack tack-daemon > SHA256SUMS
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tack-${{ github.ref_name }}-${{ matrix.target }}
          path: dist/${{ matrix.target }}/*

  publish:
    if: contains(github.ref_name, '-rc')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: tack-${{ github.ref_name }}-*
          path: dist
      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mapfile -t files < <(find dist -type f | sort)

          gh release create "${{ github.ref_name }}" \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --verify-tag \
            --title "tack ${{ github.ref_name }}" \
            --notes "Rust-built tack CLI and daemon for the three targets; checksums attached; release candidate for slice 1." \
            "${files[@]}"
