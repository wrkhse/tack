name: codex

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  conformance:
    # The exact check name the main ruleset requires.
    name: conformance (codex)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CODEX_VERSION: "0.172.0"
    steps:
      # No API key: the model is a loopback stand-in started by run.mjs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3

      # The committed lockfile pins Codex and its native package; no install
      # script runs.
      - name: Install Codex
        run: |
          set -euo pipefail

          npm ci --prefix test/codex --ignore-scripts --no-audit --no-fund

          bin="$GITHUB_WORKSPACE/test/codex/node_modules/.bin"
          echo "$bin" >> "$GITHUB_PATH"
          export PATH="$bin:$PATH"

          version="$(codex --version)"
          echo "$version"
          if [ "${version##* }" != "$CODEX_VERSION" ]; then
            echo "codex reports $version, expected $CODEX_VERSION" >&2
            exit 1
          fi

      - name: Build tack
        run: |
          set -euo pipefail

          cargo build --workspace --bins --locked
          echo "$GITHUB_WORKSPACE/target/debug" >> "$GITHUB_PATH"
      # tack build writes hook trust into Codex's user config, so the build
      # gets its own throwaway CODEX_HOME, never the runner's.
      - name: Build the adapter
        run: |
          set -euo pipefail

          export CODEX_HOME="$RUNNER_TEMP/codex-build-home"
          mkdir -p "$CODEX_HOME"
          chmod 700 "$CODEX_HOME"
          tack build fixtures/safe-push --out dist --target codex
      - name: Adapter Node tests
        run: |
          set -euo pipefail
          shopt -s nullglob

          tests=(adapters/codex/*.test.mjs)
          if [ "${#tests[@]}" -eq 0 ]; then
            echo "no adapter Node tests in adapters/codex"
          fi
          for test in "${tests[@]}"; do
            node "$test"
          done

      # A network namespace with loopback alone: the run cannot reach anything
      # but the stand-in, and run.mjs checks that before and after the cases.
      - name: Codex conformance
        env:
          TACK_CODEX_ARTIFACTS: ${{ runner.temp }}/codex-artifacts
          TACK_CODEX_OFFLINE: "1"
        run: |
          set -euo pipefail

          mkdir -p "$TACK_CODEX_ARTIFACTS"
          sudo --preserve-env env "PATH=$PATH" RUN_UID="$(id -u)" RUN_GID="$(id -g)" \
            unshare --net -- /bin/sh -c '
              set -eu
              ip link set lo up
              ip -o link show
              exec setpriv --reuid="$RUN_UID" --regid="$RUN_GID" --init-groups \
                node test/codex/run.mjs
            '

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-codex
          path: ${{ runner.temp }}/codex-artifacts
          if-no-files-found: ignore
