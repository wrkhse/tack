name: claude

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: claude-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  conformance:
    # The exact check name the main ruleset requires.
    name: conformance (claude)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLAUDE_CODE_VERSION: "2.1.328"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
      DISABLE_AUTOUPDATER: "1"
    steps:
      # No API key: the model is a loopback stand-in started by run.mjs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3

      # Every install script is off; only claude-code's own postinstall,
      # which places the native binary, runs.
      - name: Install Claude Code
        run: |
          set -euo pipefail

          prefix="$RUNNER_TEMP/claude-npm"
          mkdir -p "$prefix"
          npm install --global --prefix "$prefix" --ignore-scripts \
            --no-audit --no-fund "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
          (
            cd "$prefix/lib/node_modules/@anthropic-ai/claude-code"
            npm run postinstall
          )

          echo "$prefix/bin" >> "$GITHUB_PATH"
          export PATH="$prefix/bin:$PATH"

          version="$(claude --version)"
          echo "$version"
          if [ "${version%% *}" != "$CLAUDE_CODE_VERSION" ]; then
            echo "claude reports $version, expected $CLAUDE_CODE_VERSION" >&2
            exit 1
          fi

      - name: Build tack
        run: |
          set -euo pipefail

          cargo build --workspace --bins --locked
          echo "$GITHUB_WORKSPACE/target/debug" >> "$GITHUB_PATH"
      - run: tack build fixtures/safe-push --out dist --target claude
      # A diagnostic, not a gate: what Claude Code reads from the mod. A
      # loadable hooks module gives a `hooks:` line; a refused one gives an
      # error or warning line naming the reason.
      - name: Validate the mod
        continue-on-error: true
        env:
          ARTIFACTS: ${{ runner.temp }}/claude-artifacts
        run: |
          set -uo pipefail

          mkdir -p "$ARTIFACTS"
          log="$ARTIFACTS/validate.log"
          status=0
          claude plugin validate dist/claude > "$log" 2>&1 || status=$?
          cat "$log"

          if grep -Eq '^[[:space:]]*hooks:' "$log"; then
            echo "validate lists a hooks line for dist/claude"
          else
            echo "::warning::claude plugin validate lists no hooks line for dist/claude"
          fi

          echo "validate lines on hooks, errors and warnings:"
          grep -Ein 'hook|warning|error|✘|⚠' "$log" || echo "(none)"

          exit "$status"
      # The mod's fail-closed checks, under a scripted $ with no process run.
      - run: node adapters/claude/register.test.mjs
      - run: node test/claude/run.mjs
        env:
          TACK_CLAUDE_ARTIFACTS: ${{ runner.temp }}/claude-artifacts

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-claude
          path: ${{ runner.temp }}/claude-artifacts
          if-no-files-found: ignore
