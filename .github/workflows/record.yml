name: record

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to record, for example v0.1.0-rc.4"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: record-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      TARGET: x86_64-unknown-linux-gnu
      OPENCODE_VERSION: "2.3.0"
    steps:
      - name: Require a tag
        run: |
          set -euo pipefail

          if [ -z "$TAG" ]; then
            echo 'record: TAG is empty; dispatch with a tag or publish a release' >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0

      - name: Install the recording prerequisites
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get -y install --no-install-recommends ffmpeg
          sudo apt-get install -y fonts-dejavu-core fontconfig
          fc-cache -f

          cd "$RUNNER_TEMP"
          curl -fsSLO \
            https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz
          sha='02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239'
          echo "$sha  zig-x86_64-linux-0.15.2.tar.xz" | sha256sum -c -
          tar -xf zig-x86_64-linux-0.15.2.tar.xz
          zigdir="$RUNNER_TEMP/zig-x86_64-linux-0.15.2"
          echo "$zigdir" >> "$GITHUB_PATH"
          export PATH="$zigdir:$PATH"
          zig version

          cargo install --locked --version 1.2.1 terminal-control
          termctrl --version

          {
            echo "--- fc-list ---"
            fc-list | head -20
            echo "--- save help ---"
            termctrl save --help
            echo "--- video help ---"
            termctrl video --help
          } > termctrl-font-diagnostics.txt 2>&1
          cat termctrl-font-diagnostics.txt

      - name: Font probe
        run: |
          set -euo pipefail

          printf 'FONT_PROBE_VISIBLE\n' | \
            termctrl save --pipe --format png --cols 100 --rows 10 \
              --pixel-ratio 1 --padding 0 \
              --font-family 'DejaVu Sans Mono' --out fontprobe -- cat

      - name: Install the rc binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          cd "$RUNNER_TEMP"
          mkdir -p tack-release tack-bin
          cd tack-release
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "tack-$TAG-$TARGET.tar.gz"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "SHA256SUMS"
          grep -F "tack-$TAG-$TARGET.tar.gz" SHA256SUMS | sha256sum -c -
          tar -xzf "tack-$TAG-$TARGET.tar.gz" -C "$RUNNER_TEMP/tack-bin"
          tar -tzf "tack-$TAG-$TARGET.tar.gz" > "$RUNNER_TEMP/tack-files.txt"
          grep -qx 'tack' "$RUNNER_TEMP/tack-files.txt"
          grep -qx 'tack-daemon' "$RUNNER_TEMP/tack-files.txt"

          echo "$RUNNER_TEMP/tack-bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/tack-bin:$PATH"
          actual="$(tack --version)"
          expected="tack ${TAG#v}"
          echo "tack --version: $actual"
          echo "expected:       $expected"
          if [ "$actual" != "$expected" ]; then
            echo "tack --version printed '$actual', expected '$expected'" >&2
            exit 1
          fi

      - name: Install OpenCode
        run: |
          set -euo pipefail

          bin="$RUNNER_TEMP/opencode-bin"
          mkdir -p "$bin"
          cd "$bin"
          base="https://github.com/anomalyco/opencode/releases/download"
          curl -fsSLO "$base/v$OPENCODE_VERSION/opencode-linux-x64.tar.gz"
          sha='fc0f81522aceeabac47693d88389efa2bc517ce74c2c38fd6967819fcc6e4d3b'
          echo "$sha  opencode-linux-x64.tar.gz" | sha256sum -c -
          tar -xzf opencode-linux-x64.tar.gz
          chmod +x opencode

          echo "$bin" >> "$GITHUB_PATH"
          export PATH="$bin:$PATH"
          opencode --version

      - name: Record the session
        run: |
          set -euo pipefail

          mkdir -p frames

          export TACK_CLI="$RUNNER_TEMP/tack-bin/tack"
          export TACK_DAEMON_BIN="$RUNNER_TEMP/tack-bin/tack-daemon"
          export OPENCODE_BIN="$RUNNER_TEMP/opencode-bin/opencode"

          termctrl start rec --cols 160 --rows 42 --record run.termctrl -- \
            node test/e2e/record.mjs
          termctrl wait rec "OpenCode session" --timeout 30000
          termctrl mark rec ready
          termctrl save rec --format png --pixel-ratio 1 --padding 0 \
            --font-family 'DejaVu Sans Mono' \
            --out frames/01-ready

          cmd="opencode run --standalone -m fake/scripted 'push my branch'"
          termctrl send rec "text:$cmd" enter
          termctrl wait rec "push blocked" --timeout 30000
          termctrl mark rec denied
          termctrl save rec --format png --pixel-ratio 1 --padding 0 \
            --font-family 'DejaVu Sans Mono' \
            --out frames/02-denied
          termctrl wait rec "guard_status" --timeout 30000
          termctrl mark rec tool
          termctrl save rec --format png --pixel-ratio 1 --padding 0 \
            --font-family 'DejaVu Sans Mono' \
            --out frames/03-tool
          termctrl wait rec "SESSION_DONE" --timeout 30000

          proof="git log --oneline origin/main; echo NO_PUSH_REACHED_ORIGIN"
          termctrl send rec "text:$proof" enter
          termctrl wait rec "NO_PUSH_REACHED_ORIGIN" --timeout 30000
          termctrl mark rec proof
          termctrl save rec --format png --pixel-ratio 1 --padding 0 \
            --font-family 'DejaVu Sans Mono' \
            --out frames/04-proof

          # Wait up to 5 s for verdict.txt to reflect the evidence before the
          # stop. This only waits; the exact verdict check below still gates
          # the job.
          for _ in $(seq 1 20); do
            if grep -qx 'push_denied=true' verdict.txt 2>/dev/null &&
              grep -qx 'guard_status_ran=true' verdict.txt 2>/dev/null &&
              grep -qx 'no_push_recorded=true' verdict.txt 2>/dev/null; then
              break
            fi
            sleep 0.25
          done
          termctrl stop rec

      - name: Render the GIF
        run: |
          set -euo pipefail

          termctrl video run.termctrl \
            --pixel-ratio 1 --padding 0 \
            --font-family 'DejaVu Sans Mono' \
            --edit test/e2e/video-edit.json --footer --out run.mp4

          filter="fps=10,scale=1000:-1:flags=lanczos,split[s0][s1];"
          filter="${filter}[s0]palettegen=max_colors=32:stats_mode=diff[p];"
          filter="${filter}[s1][p]paletteuse=dither=none"
          ffmpeg -y -i run.mp4 -vf "$filter" -loop 0 demo.gif

      - name: Check the verdict and the GIF
        run: |
          set -euo pipefail

          test -s verdict.txt
          grep -qx 'push_denied=true' verdict.txt
          grep -qx 'guard_status_ran=true' verdict.txt
          grep -qx 'no_push_recorded=true' verdict.txt

          test -f demo.gif
          bytes="$(wc -c < demo.gif)"
          if [ "$bytes" -ge 3000000 ]; then
            echo "demo.gif too large: $bytes bytes" >&2
            exit 1
          fi

          width="$(ffprobe -v error -select_streams v \
            -show_entries stream=width -of csv=p=0 demo.gif)"
          if [ "$width" -gt 1200 ]; then
            echo "demo.gif too wide: $width" >&2
            exit 1
          fi

      - name: Capture recording diagnostics (always)
        if: always()
        run: |
          set +e

          {
            echo "--- at denied ---"
            termctrl show --recording run.termctrl --at-marker denied
            echo "--- at tool ---"
            termctrl show --recording run.termctrl --at-marker tool
            echo "--- at proof ---"
            termctrl show --recording run.termctrl --at-marker proof
            echo "--- markers ---"
            termctrl markers run.termctrl
            echo "--- verdict ---"
            cat verdict.txt
          } > recording-diagnostics.txt 2>&1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        if: always()
        with:
          name: slice-1-recording-debug
          path: |
            run.termctrl
            recording-diagnostics.txt
            termctrl-font-diagnostics.txt
            fontprobe.png
            verdict.txt
            demo.gif
            frames/*.png
          if-no-files-found: warn

      - name: Capture recording diagnostics
        if: failure()
        run: |
          set +e

          {
            termctrl show rec
            echo "--- markers ---"
            termctrl markers run.termctrl
            echo "--- session status ---"
            termctrl status rec
            echo "--- artefacts ---"
            ls -l verdict.txt demo.gif run.termctrl frames
          } > termctrl-diagnostics.txt 2>&1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        if: failure()
        with:
          name: termctrl-diagnostics
          path: termctrl-diagnostics.txt
          if-no-files-found: warn

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: slice-1-recording
          path: demo.gif
          if-no-files-found: error

  record-claude:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      TARGET: x86_64-unknown-linux-gnu
      CLAUDE_CODE_VERSION: "2.1.328"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
      DISABLE_AUTOUPDATER: "1"
    steps:
      - name: Require a tag
        run: |
          set -euo pipefail

          if [ -z "$TAG" ]; then
            echo 'record: TAG is empty; dispatch with a tag or publish a release' >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0

      - name: Install the recording prerequisites
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get -y install --no-install-recommends ffmpeg
          sudo apt-get install -y fonts-dejavu-core fontconfig
          fc-cache -f

          cd "$RUNNER_TEMP"
          curl -fsSLO \
            https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz
          sha='02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239'
          echo "$sha  zig-x86_64-linux-0.15.2.tar.xz" | sha256sum -c -
          tar -xf zig-x86_64-linux-0.15.2.tar.xz
          zigdir="$RUNNER_TEMP/zig-x86_64-linux-0.15.2"
          echo "$zigdir" >> "$GITHUB_PATH"
          export PATH="$zigdir:$PATH"
          zig version

          cargo install --locked --version 1.2.1 terminal-control
          termctrl --version

          {
            echo "--- fc-list ---"
            fc-list | head -20
            echo "--- save help ---"
            termctrl save --help
            echo "--- video help ---"
            termctrl video --help
          } > termctrl-font-diagnostics.txt 2>&1
          cat termctrl-font-diagnostics.txt

      - name: Font probe
        run: |
          set -euo pipefail

          printf 'FONT_PROBE_VISIBLE\n' | \
            termctrl save --pipe --format png --cols 100 --rows 10 \
              --pixel-ratio 1 --padding 0 \
              --font-family 'DejaVu Sans Mono' --out fontprobe -- cat

      - name: Install the rc binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          cd "$RUNNER_TEMP"
          mkdir -p tack-release tack-bin
          cd tack-release
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "tack-$TAG-$TARGET.tar.gz"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "SHA256SUMS"
          grep -F "tack-$TAG-$TARGET.tar.gz" SHA256SUMS | sha256sum -c -
          tar -xzf "tack-$TAG-$TARGET.tar.gz" -C "$RUNNER_TEMP/tack-bin"
          tar -tzf "tack-$TAG-$TARGET.tar.gz" > "$RUNNER_TEMP/tack-files.txt"
          grep -qx 'tack' "$RUNNER_TEMP/tack-files.txt"
          grep -qx 'tack-daemon' "$RUNNER_TEMP/tack-files.txt"
          grep -qx 'tack-hook' "$RUNNER_TEMP/tack-files.txt"

          echo "$RUNNER_TEMP/tack-bin" >> "$GITHUB_PATH"
          {
            echo "TACK_CLI=$RUNNER_TEMP/tack-bin/tack"
            echo "TACK_DAEMON_BIN=$RUNNER_TEMP/tack-bin/tack-daemon"
            echo "TACK_HOOK_BIN=$RUNNER_TEMP/tack-bin/tack-hook"
          } >> "$GITHUB_ENV"
          export PATH="$RUNNER_TEMP/tack-bin:$PATH"
          actual="$(tack --version)"
          expected="tack ${TAG#v}"
          echo "tack --version: $actual"
          echo "expected:       $expected"
          if [ "$actual" != "$expected" ]; then
            echo "tack --version printed '$actual', expected '$expected'" >&2
            exit 1
          fi

      # Every install script is off; only claude-code's own postinstall,
      # which places the native binary, runs.
      - name: Install Claude Code
        run: |
          set -euo pipefail

          prefix="$RUNNER_TEMP/claude-npm"
          mkdir -p "$prefix"
          npm install --global --prefix "$prefix" --ignore-scripts \
            --no-audit --no-fund "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
          (
            cd "$prefix/lib/node_modules/@anthropic-ai/claude-code"
            npm run postinstall
          )

          echo "$prefix/bin" >> "$GITHUB_PATH"
          export PATH="$prefix/bin:$PATH"

          version="$(claude --version)"
          echo "$version"
          if [ "${version%% *}" != "$CLAUDE_CODE_VERSION" ]; then
            echo "claude reports $version, expected $CLAUDE_CODE_VERSION" >&2
            exit 1
          fi

      # The rc's tack builds the mod Claude Code loads; a validation failure
      # fails the job.
      - name: Validate the mod
        run: |
          set -euo pipefail

          mod="$RUNNER_TEMP/claude-mod"
          tack build fixtures/safe-push --out "$mod" --target claude
          claude plugin validate "$mod/claude"

      - name: Record the session
        run: |
          set -euo pipefail

          mkdir -p frames

          termctrl start claude-rec --cols 160 --rows 42 \
            --record run-claude.termctrl -- \
            node test/e2e/record-claude.mjs
          termctrl wait claude-rec "Claude session" --timeout 30000
          termctrl mark claude-rec ready
          termctrl save claude-rec --format png --pixel-ratio 1 --padding 0 \
            --font-family 'DejaVu Sans Mono' \
            --out frames/01-ready

          termctrl wait claude-rec "tack: push blocked" --timeout 30000
          termctrl mark claude-rec denied
          termctrl save claude-rec --format png --pixel-ratio 1 --padding 0 \
            --font-family 'DejaVu Sans Mono' \
            --out frames/02-denied
          termctrl wait claude-rec "guard_status: daemon ok" --timeout 30000
          termctrl mark claude-rec tool
          termctrl save claude-rec --format png --pixel-ratio 1 --padding 0 \
            --font-family 'DejaVu Sans Mono' \
            --out frames/03-tool
          termctrl wait claude-rec "SESSION_DONE" --timeout 30000

          proof="git log --oneline origin/main; echo NO_PUSH_REACHED_ORIGIN"
          termctrl send claude-rec "text:$proof" enter
          termctrl wait claude-rec "NO_PUSH_REACHED_ORIGIN" --timeout 30000
          termctrl mark claude-rec proof
          termctrl save claude-rec --format png --pixel-ratio 1 --padding 0 \
            --font-family 'DejaVu Sans Mono' \
            --out frames/04-proof

          # Wait up to 5 s for verdict-claude.txt to reflect the evidence
          # before the stop. This only waits; the exact verdict check below
          # still gates the job.
          for _ in $(seq 1 20); do
            if grep -qx 'push_denied=true' verdict-claude.txt 2>/dev/null &&
              grep -qx 'guard_status_ran=true' verdict-claude.txt 2>/dev/null &&
              grep -qx 'no_push_recorded=true' verdict-claude.txt 2>/dev/null &&
              grep -qx 'hook_called=true' verdict-claude.txt 2>/dev/null; then
              break
            fi
            sleep 0.25
          done
          termctrl stop claude-rec

      - name: Render the GIF
        run: |
          set -euo pipefail

          termctrl video run-claude.termctrl \
            --pixel-ratio 1 --padding 0 \
            --font-family 'DejaVu Sans Mono' \
            --edit test/e2e/video-edit-claude.json --footer \
            --out run-claude.mp4

          filter="fps=10,scale=1000:-1:flags=lanczos,split[s0][s1];"
          filter="${filter}[s0]palettegen=max_colors=32:stats_mode=diff[p];"
          filter="${filter}[s1][p]paletteuse=dither=none"
          ffmpeg -y -i run-claude.mp4 -vf "$filter" -loop 0 demo-claude.gif

      - name: Check the verdict and the GIF
        run: |
          set -euo pipefail

          test -s verdict-claude.txt
          grep -qx 'push_denied=true' verdict-claude.txt
          grep -qx 'guard_status_ran=true' verdict-claude.txt
          grep -qx 'no_push_recorded=true' verdict-claude.txt
          grep -qx 'hook_called=true' verdict-claude.txt

          test -f demo-claude.gif
          bytes="$(wc -c < demo-claude.gif)"
          if [ "$bytes" -ge 3000000 ]; then
            echo "demo-claude.gif too large: $bytes bytes" >&2
            exit 1
          fi

          width="$(ffprobe -v error -select_streams v \
            -show_entries stream=width -of csv=p=0 demo-claude.gif)"
          if [ "$width" -gt 1200 ]; then
            echo "demo-claude.gif too wide: $width" >&2
            exit 1
          fi

      - name: Capture recording diagnostics (always)
        if: always()
        run: |
          set +e

          {
            echo "--- at denied ---"
            termctrl show --recording run-claude.termctrl --at-marker denied
            echo "--- at tool ---"
            termctrl show --recording run-claude.termctrl --at-marker tool
            echo "--- at proof ---"
            termctrl show --recording run-claude.termctrl --at-marker proof
            echo "--- markers ---"
            termctrl markers run-claude.termctrl
            echo "--- verdict ---"
            cat verdict-claude.txt
          } > recording-diagnostics-claude.txt 2>&1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        if: always()
        with:
          name: slice-2-recording-debug
          path: |
            run-claude.termctrl
            recording-diagnostics-claude.txt
            termctrl-font-diagnostics.txt
            fontprobe.png
            verdict-claude.txt
            demo-claude.gif
            frames/*.png
          if-no-files-found: warn

      - name: Capture recording diagnostics
        if: failure()
        run: |
          set +e

          {
            termctrl show claude-rec
            echo "--- markers ---"
            termctrl markers run-claude.termctrl
            echo "--- session status ---"
            termctrl status claude-rec
            echo "--- artefacts ---"
            ls -l verdict-claude.txt demo-claude.gif run-claude.termctrl frames
          } > termctrl-diagnostics-claude.txt 2>&1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        if: failure()
        with:
          name: termctrl-diagnostics-claude
          path: termctrl-diagnostics-claude.txt
          if-no-files-found: warn

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: slice-2-recording
          path: demo-claude.gif
          if-no-files-found: error

