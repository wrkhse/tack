            termctrl show --recording run-codex.termctrl --at-marker denied
            echo "--- at tool ---"
            termctrl show --recording run-codex.termctrl --at-marker tool
            echo "--- at allow ---"
            termctrl show --recording run-codex.termctrl --at-marker allow
            echo "--- at session-done ---"
            termctrl show --recording run-codex.termctrl --at-marker session-done
            echo "--- at proof ---"
