          grep -qx 'guard_status_ran=true' verdict-codex.txt
          grep -qx 'no_push_recorded=true' verdict-codex.txt
          grep -qx 'hook_called=true' verdict-codex.txt
          grep -qx 'extension_loaded=true' verdict-codex.txt
          grep -qx 'harmless_allowed=true' verdict-codex.txt

          test -f demo-codex.gif
          bytes="$(wc -c < demo-codex.gif)"
          if [ "$bytes" -ge 3000000 ]; then
            echo "demo-codex.gif too large: $bytes bytes" >&2
            exit 1
          fi

          width="$(ffprobe -v error -select_streams v \
