name: record

on:
  release:
    types: [published]
  pull_request:
    paths:
      - .github/workflows/record.yml
      - test/e2e/record.mjs
      - test/e2e/record.tape
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to record, for example v0.1.0-rc.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: record-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag || 'v0.1.0-rc.1' }}
      TARGET: x86_64-unknown-linux-gnu
      OPENCODE_VERSION: "2.3.0"
      VHS_IMAGE: ghcr.io/charmbracelet/vhs:v0.12.1@sha256:ea49a6a1c529be83153e88321892b5585964418f0b9055e8c1e0d732194234a3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3

      - name: Stage Node for the VHS container
        run: |
          set -euo pipefail

          prefix="$(dirname "$(dirname "$(command -v node)")")"
          cp -a "$prefix" "$RUNNER_TEMP/node"
          test -x "$RUNNER_TEMP/node/bin/node"
          "$RUNNER_TEMP/node/bin/node" --version

      - name: Install the rc binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          cd "$RUNNER_TEMP"
          mkdir -p tack-release tack-bin
          cd tack-release
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "tack-$TAG-$TARGET.tar.gz"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "SHA256SUMS"
          grep -F "tack-$TAG-$TARGET.tar.gz" SHA256SUMS | sha256sum -c -
          tar -xzf "tack-$TAG-$TARGET.tar.gz" -C "$RUNNER_TEMP/tack-bin"
          tar -tzf "tack-$TAG-$TARGET.tar.gz" > "$RUNNER_TEMP/tack-files.txt"
          grep -qx 'tack' "$RUNNER_TEMP/tack-files.txt"
          grep -qx 'tack-daemon' "$RUNNER_TEMP/tack-files.txt"

          echo "$RUNNER_TEMP/tack-bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/tack-bin:$PATH"
          tack --version
          tack --version | grep -F "${TAG#v}"

      - name: Install OpenCode
        run: |
          set -euo pipefail

          bin="$RUNNER_TEMP/opencode-bin"
          mkdir -p "$bin"
          cd "$bin"
          base="https://github.com/anomalyco/opencode/releases/download"
          curl -fsSLO "$base/v$OPENCODE_VERSION/opencode-linux-x64.tar.gz"
          sha='fc0f81522aceeabac47693d88389efa2bc517ce74c2c38fd6967819fcc6e4d3b'
          echo "$sha  opencode-linux-x64.tar.gz" | sha256sum -c -
          tar -xzf opencode-linux-x64.tar.gz
          chmod +x opencode

          echo "$bin" >> "$GITHUB_PATH"
          export PATH="$bin:$PATH"
          opencode --version

      - name: Build the VHS image with git
        run: |
          set -euo pipefail

          docker build -t tack-vhs-git - <<EOF
          FROM $VHS_IMAGE
          RUN apt-get update && apt-get -y install --no-install-recommends git tmux
          EOF

      - name: Record the session
        run: |
          set -euo pipefail

          docker run --rm \
            -v "$PWD:/vhs" \
            -v "$RUNNER_TEMP:/bins" \
            -v "$RUNNER_TEMP/node:/node" \
            -w /vhs \
            -e PATH=/node/bin:/usr/bin:/bin \
            -e TACK_CLI=/bins/tack-bin/tack \
            -e TACK_DAEMON_BIN=/bins/tack-bin/tack-daemon \
            -e OPENCODE_BIN=/bins/opencode-bin/opencode \
            tack-vhs-git test/e2e/record.tape

      - name: Render the final GIF
        run: |
          set -euo pipefail

          filter="fps=10,scale=1200:-1:flags=lanczos,split[s0][s1];"
          filter="${filter}[s0]palettegen[p];[s1][p]paletteuse"

          docker run --rm \
            --entrypoint ffmpeg \
            --volume "$PWD:/vhs" \
            -w /vhs \
            tack-vhs-git \
            -y -i /vhs/vhs.gif -vf "$filter" -loop 0 /vhs/demo.gif

      - name: Check the verdict and the GIF
        run: |
          set -euo pipefail

          test -s verdict.txt
          grep -qx 'push_denied=true' verdict.txt
          grep -qx 'guard_status_ran=true' verdict.txt
          grep -qx 'no_push_recorded=true' verdict.txt

          test -f demo.gif
          bytes="$(wc -c < demo.gif)"
          if [ "$bytes" -ge 3000000 ]; then
            echo "demo.gif too large: $bytes bytes" >&2
            exit 1
          fi

          width="$(
            docker run --rm \
              --entrypoint ffprobe \
              --volume "$PWD:/vhs" \
              -w /vhs \
              tack-vhs-git \
              -v error -select_streams v \
              -show_entries stream=width -of csv=p=0 demo.gif
          )"
          if [ "$width" -gt 1200 ]; then
            echo "demo.gif too wide: $width" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: slice-1-recording
          path: demo.gif
          if-no-files-found: error
