name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  # Runs on main are never cancelled: a queued push waits for the running one.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # fallow audit compares against the merge base.
          fetch-depth: 0
          persist-credentials: false
      # Installs Node from .node-version, Bun from packageManager, and Vite+ from package.json.
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          run-install: false
      - run: bun install --frozen-lockfile
      - run: bun run check

  conformance:
    name: conformance (${{ matrix.agent }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        agent: [opencode, pi]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs Node from .node-version, Bun from packageManager, and Vite+ from package.json.
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          run-install: false
      - run: bun install --frozen-lockfile
      - name: Verify the pinned install
        # An out-of-band install changes the lockfile or manifest; a postinstall
        # that did not run leaves a tiny stub instead of the real CLI.
        run: |
          git diff --exit-code -- bun.lock package.json

          test -x node_modules/.bin/opencode
          test "$(wc -c < node_modules/.bin/opencode)" -gt 1024
      - run: bun run conformance:${{ matrix.agent }}
