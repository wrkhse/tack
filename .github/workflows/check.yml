name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  # Runs on main are never cancelled: a queued push waits for the running one.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # fallow audit compares against the merge base.
          fetch-depth: 0
          persist-credentials: false
      # Installs Node from .node-version, Bun from packageManager, and Vite+ from package.json.
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          run-install: false
      - run: bun install --frozen-lockfile
      - run: bun run check

  conformance:
    name: conformance (${{ matrix.agent }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        agent: [opencode, pi]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs Node from .node-version, Bun from packageManager, and Vite+ from package.json.
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          run-install: false
      - run: bun install --frozen-lockfile
      - name: Verify the pinned install
        # An out-of-band install changes the lockfile or manifest. @opencode/cli's
        # postinstall links the binary of the installed platform package; a
        # fallback install fetches its own copy instead, which leaves the
        # lockfile untouched and the bytes unequal.
        run: |
          git diff --exit-code -- bun.lock package.json

          platform=(node_modules/@opencode/cli-*/bin/opencode)

          if [ "${#platform[@]}" -ne 1 ] || [ ! -f "${platform[0]}" ]; then
            echo "expected one platform binary, found: ${platform[*]}" >&2
            exit 1
          fi

          if [ ! -e node_modules/.bin/opencode ]; then
            echo "the suite's entry point, node_modules/.bin/opencode, is missing" >&2
            exit 1
          fi

          installed="$(readlink -f node_modules/.bin/opencode)"

          if ! cmp -s "$installed" "${platform[0]}"; then
            echo "the suite would run $installed, not the platform package's ${platform[0]}" >&2
            exit 1
          fi
      - run: bun run conformance:${{ matrix.agent }}
