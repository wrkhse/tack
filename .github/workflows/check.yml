name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  e2e:
    needs: [rust]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # No API key: the fake provider is a local model started by the runner.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
      - name: Install OpenCode
        run: |
          bin="$RUNNER_TEMP/opencode-bin"
          mkdir -p "$bin"
          cd "$bin"
          curl -fsSLO https://github.com/anomalyco/opencode/releases/download/v2.3.0/opencode-linux-x64.tar.gz
          echo 'fc0f81522aceeabac47693d88389efa2bc517ce74c2c38fd6967819fcc6e4d3b  opencode-linux-x64.tar.gz' | sha256sum -c -
          tar -xzf opencode-linux-x64.tar.gz
          chmod +x opencode
          echo "$bin" >> "$GITHUB_PATH"
          export PATH="$bin:$PATH"
          opencode --version
      - run: cargo build --workspace --bins --locked
      - run: cargo run --locked -p tack-cli -- build fixtures/safe-push --out dist
      - run: node adapters/opencode/wrapper.test.mjs
      - run: node test/e2e/run.mjs

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check

  mutants:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest@0.9.152
      - name: Compute the pull request diff
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          base="${BASE_SHA:-origin/main}"
          git diff "$base"...HEAD -- '*.rs' > pr.diff
          wc -l pr.diff
      - name: Run mutants
        shell: bash
        run: |
          set -o pipefail

          cargo mutants --in-diff pr.diff --no-shuffle -j 2 -vV | tee mutants.out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.6.2
        if: always()
        with:
          name: mutants.out
          path: mutants.out

