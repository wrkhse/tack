[workspace]
members = ["crates/protocol", "crates/luau", "crates/daemon", "crates/sdk", "adapters/opencode", "crates/cli"]
resolver = "3"

[workspace.package]
version = "0.1.0-rc.2"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros"] }
mlua = { version = "0.12", features = ["luau"] }

[workspace.lints.rust]
unsafe_code = "forbid"

# The pedantic and nursery groups with Chauffeur's explicit denials: tack is
# the daemon every project leans on, so the gates are the strict ones.
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# Explicit panics
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
unreachable = "deny"
unimplemented = "deny"
todo = "deny"
exit = "deny"
dbg_macro = "deny"
# Implicit panics
indexing_slicing = "deny"
string_slice = "deny"
arithmetic_side_effects = "deny"
unchecked_time_subtraction = "deny"
as_conversions = "deny"
# Size
too_many_lines = "deny"
