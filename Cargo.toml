[workspace]
members = ["protocol", "runtime", "daemon", "sdk", "wrapper", "cli"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.100"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros"] }
mlua = { version = "0.12", features = ["luau"] }
